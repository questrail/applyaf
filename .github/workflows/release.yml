name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # Trusted publishing mints a short lived token from this OIDC identity, so
    # there is no PyPI API token to store, rotate, or leak.
    environment:
      name: pypi
      url: https://pypi.org/p/applyaf
    permissions:
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install the project and its dependencies
        run: uv sync --locked

      - name: Verify the tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2
            exit 1
          fi

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest

      - name: Build the distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
