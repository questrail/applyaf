name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The release workflow calls this one, so that a tag cannot publish what CI
  # has not checked.
  workflow_call:
  workflow_dispatch:

# The group is a literal rather than github.workflow, which resolves to the
# calling workflow's name when this one is reused: sharing a group with the
# caller would leave the called run waiting for a slot the caller is holding.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The repository default is write; nothing here needs more than to read the
# code it checks.
permissions:
  contents: read

# Each job installs its environment once, deliberately, in the step that says
# so. Without this every `uv run` below would re-resolve and reinstall the
# project on top of that. In the floor job it would do worse than waste time:
# a re-sync there resolves at the default resolution and would quietly undo the
# lowest-direct install the job exists to test.
env:
  UV_NO_SYNC: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the project and its dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest --cov --cov-report=lcov:coverage.lcov --cov-report=term

      # Skipped when the release workflow calls this one: github.ref is the
      # caller's, so a tag run would re-report the coverage the same commit
      # already reported when it landed on master.
      - name: Report coverage to Coveralls
        if: matrix.python-version == '3.13' && !startsWith(github.ref, 'refs/tags/')
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          file: coverage.lcov
          format: lcov

  floor:
    name: Lowest supported dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          # The floor is a claim about numpy, not about the interpreter, and
          # numpy ships no cp314 wheels below 2.3.2, so resolving to the
          # numpy>=2.2.0 floor on 3.14 would compile it from source. Check it
          # on the oldest interpreter the project supports instead.
          python-version: "3.12"

      # The version floors in pyproject.toml are a promise to anyone installing
      # applyaf alongside something else that holds numpy back, and the test
      # job never tests them: it installs whatever uv.lock pins, which is the
      # newest numpy rather than the oldest allowed one. --resolution
      # lowest-direct installs the oldest instead, so that a change which
      # quietly starts needing a newer numpy fails here rather than in a bug
      # report. It re-resolves instead of reading uv.lock, and rewrites the
      # lock in passing, which is why --locked is absent and why this belongs
      # on a throwaway checkout.
      - name: Install the lowest dependency versions pyproject.toml allows
        run: uv sync --resolution lowest-direct

      - name: Report the resolved numpy version
        run: uv run python -c "import numpy; print('numpy', numpy.__version__)"

      # Only the suite runs here. lowest-direct pins the dev tools to their
      # floors too, and an older ruff formats differently, so linting at this
      # resolution would report on the tooling rather than on the floor.
      - name: Test
        run: uv run pytest
